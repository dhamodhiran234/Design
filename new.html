<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .con{
            background-color: rgb(113, 14, 253);
            display: flex;
            justify-content: space-between;
            margin: 15px;
            padding: 15px;
            color: white;
            border-radius: 20px;
            border: 4px solid red;
        }
        ol{
            display: flex;
            list-style: none;
            margin: 15px;
        }
        li{
            margin-left: 15px;
            cursor: pointer;
            font-size: medium;
        }
        li:hover{
            color: yellow;
        }
        .item{
            display: block;
            background-color: rgb(2, 2, 30);
            text-align: center;
            width: 100%;
            max-width: 350px;
            margin: 50px;
            border-radius: 30px;
            color: white;
            padding-top: 10px;
            margin-top: 100px;
            padding-bottom: 40px;
            border:4px solid orangered;
        }
        h3{
            font-size: xx-large;
           
        }
        h3:hover{
            color: red;
        }
        h4{
            margin-top: 20px;
            font-size: larger;
            padding: 5px;
            transition: 0.1s;
        }
        h4:hover{
            background-color: white;
            color: rgb(2, 2, 32);
            margin-left: 1px;
            color: red;
            border: 4px solid lightcoral;
            margin: 20px;
            
            border-radius: 20px;
        }
        button{
            margin-left: 300px;
            font-size: xx-large;
            color: white;
            background-color: rgb(3, 3, 32);
            border: none;
        }
        button:hover{
            cursor: pointer;
            color: red;
        }
       
        @media (max-width:600px){
            .con{
                display: block;
                text-align: center;
            }
            ol{
                justify-content: center;
            }
        }
        
    </style>
    
</head>
<body>
    <div class="con">
    <h1>codinglab</h1>
    <ol>
        <li>home</li>
            </li>
        <li>abount</li>
        <li>protfolio</li>
        <li>services</li>
    </ol>
    </div>

    <div class="item">
        <button>x</button>
        <h3>codinglab</h3>
        <h4>home</h4>
        <h4>abount</h4>
        <h4>portofolio</h4>
        <h4>service</h4>
        <h4>contact</h4>

    </div>
</body>
</html>
