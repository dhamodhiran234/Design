<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        div{
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            background-color: bisque;
            margin:15px;
            border-radius: 20px;padding: 10px;
        }
        ol{
            display: flex;
            
        }
        li{
            font-size: larger;
            list-style: none;
            margin: 15px;
        }
        h1{
            margin-left: 50px;
            margin-top: 5px;

        }
        @media (max-width:800px){
            div{
                display: block;
                text-align: center;
            }
            ol{
                justify-content: center;
                display: flex;
                margin-left: 50px;
            }
        }
    </style>
</head>
<body>
    <div>
    <h1>PERFUME SHOPE</h1>
    <ol>
        <li>sign up</li>
        <li>login in</li>
        <li>log out</li>
    </ol>
    </div>
</body>
</html>
