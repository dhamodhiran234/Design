<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .top{
            display: flex;
        }
        .side{
            background-color: rgb(2, 2, 50);
            color: white;

        h2{

        h4:hover{
            background-color: white;
            color: red;

            transition: 0.9s;
        }
        .head{

        }
        input{
            margin-top: 20px;

            max-width: 600px;
            height: 45px;
            border-radius: 10px;

            margin-left: 3px;
            margin-right: 3px;
            
        }
        input:hover{
            margin-left: 10px;
        }
        input:focus{
            border: 4px solid blue;
            background-color: black;
            color: white;
        }
        input::placeholder{
            text-align: center;
        }
        h2 u{

            input{

        @media (max-width:900px){

            } 
        }
        .body{
            display: block;
        }

<div class="head">
